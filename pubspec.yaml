name: noa
description: "A new Flutter project."
publish_to: 'none'
version: 1.5.2

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  logging: ^1.2.0
  image: ^4.1.7
  archive: ^3.5.0
  uuid: ^4.4.0
  collection: ^1.18.0
  just_audio: ^0.9.37
  path_provider: ^2.1.3
  audio_session: ^0.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/2x/
    - assets/lua_scripts/